<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bluefin Social Preview Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #080c14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    color: #ffffff;
    position: relative;
  }
  .background {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  /* Cinematic contrast scrim: darkens bottom and edges while keeping the art vibrant */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(8, 12, 20, 0.95) 0%, rgba(8, 12, 20, 0.82) 32%, rgba(8, 12, 20, 0.35) 60%, transparent 100%),
      radial-gradient(ellipse 90% 60% at 20% 100%, rgba(14, 27, 49, 0.6) 0%, transparent 80%),
      linear-gradient(to right, rgba(8, 12, 20, 0.4) 0%, transparent 60%);
  }
  .top-row {
    position: absolute;
    top: 36px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 8px 18px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #e2e8f0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
  }
  .wallpaper-credit {
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
    font-size: 13px;
    color: #94a3b8;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 6px 14px;
    border-radius: 8px;
    letter-spacing: 0.05em;
  }
  .bottom-content {
    position: absolute;
    bottom: 44px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 2;
  }
  .main-lockup {
    max-width: 780px;
  }
  .wordmark-wrap {
    width: 250px;
    margin-bottom: 18px;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.7));
  }
  .wordmark-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .headline {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 12px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  }
  .subtext {
    font-size: 20px;
    font-weight: 400;
    color: #cbd5e1;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
  }
  .domain-card {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .domain-pill {
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    color: #60a5fa;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(96, 165, 250, 0.35);
    padding: 10px 22px;
    border-radius: 12px;
    letter-spacing: 0.04em;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
  <div class="background" id="bg"></div>
  <div class="scrim"></div>

  <div class="top-row">
    <div class="brand-badge">
      <span class="badge-dot"></span>
      <span>Project Bluefin</span>
    </div>
    <div class="wallpaper-credit" id="credit"></div>
  </div>

  <div class="bottom-content">
    <div class="main-lockup">
      <div class="wordmark-wrap" id="wordmark"></div>
      <div class="headline" id="headline">The Next Generation Linux Workstation</div>
      <div class="subtext" id="subtext">Designed for reliability, performance, and sustainability.</div>
    </div>
    <div class="domain-card">
      <div class="domain-pill" id="domain">projectbluefin.io</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    if (params.get('bg')) {
      document.getElementById('bg').style.backgroundImage = `url('${params.get('bg')}')`
    }
    if (params.get('credit')) {
      document.getElementById('credit').textContent = params.get('credit')
    } else {
      document.getElementById('credit').style.display = 'none'
    }
    if (params.get('headline')) {
      document.getElementById('headline').textContent = params.get('headline')
    }
    if (params.get('subtext')) {
      document.getElementById('subtext').textContent = params.get('subtext')
    }
    if (params.get('domain')) {
      document.getElementById('domain').textContent = params.get('domain')
    }
  </script>
</body>
</html>
