<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bluefin Social Preview Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #080c14;
    position: relative;
  }
  .background {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  /* Localized subtle vignette in lower-left to ensure wordmark legibility on all wallpapers */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 88%, rgba(6, 10, 18, 0.78) 0%, rgba(6, 10, 18, 0.4) 45%, transparent 75%),
      linear-gradient(to top, rgba(6, 10, 18, 0.5) 0%, transparent 40%);
  }
  .bottom-content {
    position: absolute;
    bottom: 56px;
    left: 64px;
    z-index: 2;
  }
  .wordmark-wrap {
    width: 440px;
    filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.9)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95));
  }
  .wordmark-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="background" id="bg"></div>
  <div class="scrim"></div>

  <div class="bottom-content">
    <div class="wordmark-wrap" id="wordmark"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    if (params.get('bg')) {
      document.getElementById('bg').style.backgroundImage = `url('${params.get('bg')}')`
    }
  </script>
</body>
</html>
