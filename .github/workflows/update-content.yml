name: Update Live Data

on:
  schedule:
    # Run daily at 10:00 UTC — after projectbluefin/documentation SBOM
    # pipeline completes at ~04:00–06:00 UTC so we always get fresh data.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read # allow reading repository content
      issues: write  # allow github-script to create failure issues
      actions: write # allow triggering deploy.yml workflow
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The previous run's audit is the only record of when each image last
      # verified, and failure issues have to state that. Restoring uses the
      # exact save path list, in the same order: actions/cache derives the
      # cache version from the path list, so any divergence silently restores
      # nothing.
      - name: Restore previous live data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/stream-versions.yml
            public/dakota-versions.json
            public/flickr-photos.json
            public/experiences
            src/assets/svg/growth_bluefins.svg
            .cache/website-live-data/sbom-audit.json
          key: website-live-data-
          restore-keys: |
            website-live-data-
          fail-on-cache-miss: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download Bluefin Growth Chart
        run: |
          curl https://raw.githubusercontent.com/ublue-os/countme/refs/heads/main/growth_bluefins.svg --output src/assets/svg/growth_bluefins.svg
          sed -i 's/#ffffff/#0c1016/g; s/#cccccc/#272727/g; s/#616161/#bdbdbd/g; s/#77aadd/#4285f4/g; s/id="text_16">/id="text_16" style="fill: #bdbdbd">/' src/assets/svg/growth_bluefins.svg

      - name: Verify image SBOMs and update version data
        run: npm run update:image-versions

      - name: Update Flickr photos
        run: node scripts/update-flickr-photos.js

      # Album prose and cover art only. Track ingestion scrapes YouTube via
      # yt-dlp, which is unreliable from CI, so it stays manual. A missing album
      # is recorded rather than thrown, so a routine upstream publish cannot
      # discard this run's cache save and deployment; it is escalated at the end.
      - name: Refresh back catalogue metadata
        run: node scripts/update-back-catalogue.js --metadata-only
        env:
          MISSING_ALBUMS_FILE: ${{ runner.temp }}/missing-albums.txt

      - name: Save live data to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/stream-versions.yml
            public/dakota-versions.json
            public/flickr-photos.json
            public/experiences
            src/assets/svg/growth_bluefins.svg
            .cache/website-live-data/sbom-audit.json
          key: website-live-data-${{ github.run_id }}

      - name: Trigger deployment
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The script body stays two lines on purpose. A relative dynamic import
      # inside github-script resolves against the action's own bundle, not the
      # checkout, so the real logic lives in a checked-in module that the test
      # suite executes directly.
      - name: Manage SBOM verification issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const path = await import('node:path')
            const { pathToFileURL } = await import('node:url')
            const moduleUrl = pathToFileURL(path.join(process.cwd(), 'scripts', 'lib', 'sbom-issue-sync.js')).href
            const { syncSbomIssues } = await import(moduleUrl)
            await syncSbomIssues({ github, context, core })

      # Escalates only after the cache and deployment are safely done, so the
      # resulting issue never costs a week of live data.
      - name: Report albums needing a manual ingest
        run: |
          if [ -s "${{ runner.temp }}/missing-albums.txt" ]; then
            echo "Albums published upstream but absent from public/experiences/catalogue.json:"
            cat "${{ runner.temp }}/missing-albums.txt"
            echo "Run 'npm run update:back-catalogue' locally with yt-dlp installed."
            exit 1
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const path = await import('node:path')
            const { pathToFileURL } = await import('node:url')
            const moduleUrl = pathToFileURL(path.join(process.cwd(), 'scripts', 'lib', 'sbom-issue-sync.js')).href
            const { syncWorkflowFailureIssue } = await import(moduleUrl)
            await syncWorkflowFailureIssue({ github, context, core })
